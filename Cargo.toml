[package]
name = "bft-kit"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = { version = "1.0.97", features = ["backtrace"] }
bincode = "2.0.1"
ed25519-dalek = { version = "2.1.1", features = ["digest"] }
givre = { version = "0.2.0", features = ["cggmp21-keygen", "ciphersuite-secp256k1", "spof"] }
hdrhistogram = "7.5.4"
quinn = "0.11.7"
rand = "0.9.0"
rand_distr = "0.5.1"
rand08 = { package = "rand", version = "0.8" }
secp256k1 = "0.30.0"
sha2 = "0.10.8"
slab = "0.4.9"
thiserror = "2.0.12"
threshold_crypto = "0.4.0"
tokio = { version = "1.44.1", features = ["full"] }
tokio-util = { version = "0.7.14", features = ["full"] }
tracing = "0.1.41"
tracing-subscriber = "0.3.19"
derive-where = "1.5.0"
core_affinity = "0.8.3"
lru = "0.16.0"
rocksdb = "0.24.0"
tempfile = "3.21.0"

[dev-dependencies]
criterion = "0.5.1"
rand07 = { package = "rand", version = "0.7" }
rcgen = "0.13.2"
test-log = { version = "0.2.17", features = ["trace"] }

[[bench]]
name = "threshold-sig"
harness = false

[profile.release]
debug = true
incremental = true
